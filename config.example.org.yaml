# Multi-pattern org template — copy blocks that match each account's billing model.
# See docs/onboarding-aws-auth.md (billing decision tree) and docs/getting-started.md.
#
# cp config.example.org.yaml config.yaml   # or merge into your existing config.yaml

listen_addr: ":8080"
cors_origin: "http://localhost:5173"
cost_lookback_days: 30

# --- Payer-linked (default) ---------------------------------------------------
# Cost Explorer runs from the org management account; each row is filtered by
# LINKED_ACCOUNT. Most accounts in a standard AWS Organization use this pattern.
billing_profile: org-payer.AdministratorAccess

# Optional payer API keys instead of billing_profile:
# billing_access_key_id: AKIA...
# billing_secret_access_key_env: ORG_COST_BILLING_SECRET

# Optional API auth — when set, /api/* routes require Authorization: Bearer <token>
# (except /api/health and /api/ready)
# api_token_env: ORG_COST_API_TOKEN

# Optional: daily cost snapshots for trends (default ~/.org-cost/history)
# history_dir: /Users/you/.org-cost/history
# prior_period_cache_hours: 24

accounts:
  # Payer-linked: omit billing_profile (inherits global payer CE)
  - name: production
    id: "111111111111"
    profile: Production.AdministratorAccess
    region: eu-west-1

  - name: staging
    id: "222222222222"
    profile: Staging.AdministratorAccess
    region: eu-west-1

  - name: shared-services
    id: "333333333333"
    profile: SharedServices.AdministratorAccess
    region: us-east-1

  # --- Member-billed (separate payer) ---------------------------------------
  # Cost Explorer must run FROM this account — not via org payer LINKED_ACCOUNT.
  # Use when the account has its own billing or is not on your org payer bill.
  - name: partner-production
    id: "444444444444"
    profile: Partner-Production.AdministratorAccess
    billing_profile: account
    region: eu-west-1

  - name: acquired-org-prod
    id: "555555555555"
    profile: AcquiredOrg-Production.AdministratorAccess
    billing_profile: account
    region: us-west-2

  # --- Assume role (base profile + role in target account) --------------------
  - name: sandbox
    id: "666666666666"
    profile: org-payer.AdministratorAccess
    role_arn: arn:aws:iam::666666666666:role/OrgCostReadOnly
    region: eu-west-1

  # --- API keys (no SSO profile) ----------------------------------------------
  # - name: external-vendor
  #   id: "777777777777"
  #   access_key_id: AKIA...
  #   secret_access_key_env: ORG_COST_VENDOR_SECRET
  #   region: eu-west-1

# --- Optional: CUR / Athena (historical EBS inventory) ----------------------
# Enable when you need daily disk/snapshot counts including deleted resources.
# Requires CUR export to S3 + Athena database/table. Skip for first-hour setup.
#
# cur:
#   enabled: true
#   profile: org-payer.AdministratorAccess  # defaults to billing_profile
#   region: eu-west-1                       # Athena workgroup region
#   database: athenacurcfn_your_report
#   table: your_cur_table
#   workgroup: primary
#   output_s3: s3://your-athena-results-bucket/prefix/
#   partitioned: true
