[project]
name = "org-cost-mcp"
version = "0.0.2"
description = "MCP server for AWS Org Cost Explorer (read-only dashboard API tools)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "org-cost-api contributors" }]
keywords = ["mcp", "aws", "cost-explorer", "finops", "hermes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
  "litellm>=1.55.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/kaskol10/org-cost-api"
Documentation = "https://github.com/kaskol10/org-cost-api#readme"
Repository = "https://github.com/kaskol10/org-cost-api"
Issues = "https://github.com/kaskol10/org-cost-api/issues"

[project.scripts]
org-cost-mcp = "org_cost_mcp.server:main"
org-cost-chat = "org_cost_mcp.chat_app:main"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["org_cost_mcp"]
