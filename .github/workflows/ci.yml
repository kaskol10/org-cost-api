name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated/openapi.ts is stale. Run 'cd frontend && npm run gen:api' and commit."
            exit 1
          }
      - run: npm test
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          CHART=deploy/helm/org-cost-api
          helm lint "$CHART"
          helm template t "$CHART" > /dev/null
          # Per-client tokens with autoConfig: env vars + generated api_clients.
          out="$(helm template t "$CHART" \
            --set autoConfig.enabled=true --set autoConfig.payerAccountId=123456789012 \
            --set apiToken=x \
            --set 'apiClients[0].name=backstage' --set 'apiClients[0].existingSecret=bs-token' \
            --set 'apiClients[1].name=slack-bot' --set 'apiClients[1].existingSecret=sb-token' --set 'apiClients[1].existingSecretKey=key')"
          for want in \
            'name: ORG_COST_API_CLIENT_BACKSTAGE' \
            'name: ORG_COST_API_CLIENT_SLACK_BOT' \
            'echo "api_token_env: ORG_COST_API_TOKEN"' \
            "echo '    token_env: ORG_COST_API_CLIENT_SLACK_BOT'"; do
            grep -qF -- "$want" <<<"$out" || { echo "::error::rendered chart is missing: $want"; exit 1; }
          done
          # Without apiClients, autoConfig output is unchanged (no auth lines).
          if helm template t "$CHART" --set autoConfig.enabled=true --set autoConfig.payerAccountId=123456789012 --set apiToken=x | grep -q 'api_token_env'; then
            echo "::error::autoConfig without apiClients must not change auth"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: demo
          push: false
          tags: org-cost-api:demo-ci

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator
      - run: openapi-spec-validator openapi.yaml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
