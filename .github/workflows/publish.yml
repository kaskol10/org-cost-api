name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: demo
            tags: |
              ghcr.io/${{ github.repository }}:demo
              ghcr.io/${{ github.repository }}:latest
              ghcr.io/${{ github.repository }}:demo-${{ github.ref_name }}
          - target: prod-ui
            tags: |
              ghcr.io/${{ github.repository }}:prod
              ghcr.io/${{ github.repository }}:prod-${{ github.ref_name }}
          - target: api
            tags: |
              ghcr.io/${{ github.repository }}:api
              ghcr.io/${{ github.repository }}:api-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ matrix.tags }}

  docker-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: mcp-server
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:chat
            ghcr.io/${{ github.repository }}:chat-${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:org-cost-chat
            ghcr.io/${{ github.repository }}:org-cost-chat-${{ github.ref_name }}

  pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      # Trusted publishing (OIDC) — configure on PyPI before first release:
      # https://pypi.org/manage/project/org-cost-mcp/settings/publishing/
      # Owner: kaskol10 · Repo: org-cost-api · Workflow: publish.yml
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist
