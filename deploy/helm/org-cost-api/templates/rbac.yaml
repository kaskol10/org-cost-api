{{- if .Values.bootstrapJob.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "org-cost-api.fullname" . }}-bootstrap
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "org-cost-api.configMapName" . }}"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "org-cost-api.fullname" . }}-bootstrap
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "org-cost-api.fullname" . }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "org-cost-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
