{{- if and .Values.chat.enabled .Values.chat.llm.apiKey (not .Values.chat.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "org-cost-api.chat.fullname" . }}-llm
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.chat.llm.apiKey | quote }}
{{- end }}
