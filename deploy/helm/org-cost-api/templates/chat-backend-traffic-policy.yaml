{{- if and .Values.chat.enabled .Values.gateway.enabled }}
# Raise Envoy idle / request timeouts for long LLM + SSE (default ~15s → 504).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "org-cost-api.chat.fullname" . }}
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "org-cost-api.fullname" . }}
  timeout:
    http:
      requestTimeout: {{ .Values.chat.gatewayTimeout | default "300s" | quote }}
      connectionIdleTimeout: {{ .Values.chat.gatewayIdleTimeout | default "300s" | quote }}
{{- end }}
