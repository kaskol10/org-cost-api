{{- if or .Values.autoConfig.enabled .Values.bootstrapJob.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "org-cost-api.fullname" . }}-autoconfig
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
data:
  generate-config.sh: |
    #!/usr/bin/env bash
    # Assume payer OrgCostReadOnly → ListAccounts → config.yaml (IRSA role_arn per account).
    # organizations:ListAccounts only works from the org management account.
    set -euo pipefail
    OUTPUT="${OUTPUT_PATH:-/config/config.yaml}"
    MEMBER_ROLE="${MEMBER_ROLE:-OrgCostReadOnly}"
    REGION="${AWS_DEFAULT_REGION:-eu-west-1}"
    PREFIX="${ACCOUNT_NAME_PREFIX:-}"
    CORS="${CORS_ORIGIN:-*}"
    LOOKBACK="${COST_LOOKBACK_DAYS:-30}"
    DASH_CACHE_HOURS="${DASHBOARD_CACHE_HOURS:-12}"
    PAYER_ACCOUNT_ID="${PAYER_ACCOUNT_ID:?PAYER_ACCOUNT_ID is required}"
    PAYER_ROLE_ARN="arn:aws:iam::${PAYER_ACCOUNT_ID}:role/${MEMBER_ROLE}"

    slug() {
      local s
      s="$(echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
      if [[ -z "$s" ]]; then
        s="account"
      fi
      echo "$s"
    }

    echo "Assuming payer role for ListAccounts: ${PAYER_ROLE_ARN}"
    CREDS="$(aws sts assume-role \
      --role-arn "$PAYER_ROLE_ARN" \
      --role-session-name org-cost-autoconfig \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)"
    export AWS_ACCESS_KEY_ID
    export AWS_SECRET_ACCESS_KEY
    export AWS_SESSION_TOKEN
    AWS_ACCESS_KEY_ID="$(echo "$CREDS" | awk '{print $1}')"
    AWS_SECRET_ACCESS_KEY="$(echo "$CREDS" | awk '{print $2}')"
    AWS_SESSION_TOKEN="$(echo "$CREDS" | awk '{print $3}')"
    # Clear IRSA env so the SDK uses the assumed-role keys
    unset AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE

    echo "Discovering org accounts via organizations:ListAccounts (payer ${PAYER_ACCOUNT_ID})..."
    ROWS="$(aws organizations list-accounts \
      --output text \
      --query 'Accounts[?Status==`ACTIVE`].[Id,Name]' )"

    if [[ -z "${ROWS//[[:space:]]/}" ]]; then
      echo "ERROR: no ACTIVE accounts returned" >&2
      exit 1
    fi

    TMP="$(mktemp)"
    {
      echo "# Generated by org-cost-api auto-config ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
      echo "listen_addr: \":8080\""
      echo "cors_origin: \"${CORS}\""
      echo "cost_lookback_days: ${LOOKBACK}"
      echo "dashboard_cache_hours: ${DASH_CACHE_HOURS}"
      echo "billing_profile: \"\""
      echo "billing_role_arn: \"${PAYER_ROLE_ARN}\""
      echo ""
      echo "accounts:"
    } > "$TMP"

    COUNT=0
    while IFS=$'\t' read -r aid name; do
      [[ -z "${aid:-}" ]] && continue
      display="$(slug "$name")"
      if [[ -n "$PREFIX" ]]; then
        display="${PREFIX}-${display}"
      fi
      {
        echo "  - name: ${display}"
        echo "    id: \"${aid}\""
        echo "    role_arn: arn:aws:iam::${aid}:role/${MEMBER_ROLE}"
        echo "    region: ${REGION}"
        echo ""
      } >> "$TMP"
      COUNT=$((COUNT + 1))
    done <<< "$ROWS"

    if [[ "$COUNT" -lt 1 ]]; then
      echo "ERROR: failed to parse ACTIVE accounts" >&2
      exit 1
    fi

    mkdir -p "$(dirname "$OUTPUT")"
    cp "$TMP" "$OUTPUT"
    chmod 755 "$(dirname "$OUTPUT")"
    chmod 644 "$OUTPUT"
    rm -f "$TMP"
    echo "Wrote ${OUTPUT} (${COUNT} accounts)"
    echo "---"
    cat "$OUTPUT"
{{- end }}
