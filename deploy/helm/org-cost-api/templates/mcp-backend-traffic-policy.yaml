{{- if and .Values.mcp.enabled .Values.gateway.enabled (not .Values.chat.enabled) }}
# When chat is also enabled, chat-backend-traffic-policy already raises idle/request
# timeouts on this HTTPRoute. Only emit a dedicated policy for MCP-only installs.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "org-cost-api.mcp.fullname" . }}
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "org-cost-api.fullname" . }}
  timeout:
    http:
      requestTimeout: {{ .Values.mcp.gatewayTimeout | default "300s" | quote }}
      connectionIdleTimeout: {{ .Values.mcp.gatewayIdleTimeout | default "300s" | quote }}
{{- end }}
