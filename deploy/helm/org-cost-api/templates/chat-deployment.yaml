{{- if .Values.chat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "org-cost-api.chat.fullname" . }}
  labels:
    {{- include "org-cost-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  replicas: {{ .Values.chat.replicaCount }}
  selector:
    matchLabels:
      {{- include "org-cost-api.chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "org-cost-api.chat.selectorLabels" . | nindent 8 }}
        {{- with .Values.chat.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.chat.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Chat only calls the in-cluster API + external LLM — no IRSA needed
      serviceAccountName: {{ include "org-cost-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.chat.podSecurityContext | nindent 8 }}
      containers:
        - name: chat
          image: "{{ .Values.chat.image.repository }}:{{ .Values.chat.image.tag }}"
          imagePullPolicy: {{ .Values.chat.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chat.service.port }}
              protocol: TCP
          env:
            - name: ORG_COST_API_URL
              value: {{ printf "http://%s:%v" (include "org-cost-api.fullname" .) .Values.service.port | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.chat.llm.provider | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.chat.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.chat.llm.model | quote }}
            {{- if or .Values.chat.llm.apiKey .Values.chat.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.chat.existingSecret }}{{ .Values.chat.existingSecret }}{{ else }}{{ include "org-cost-api.chat.fullname" . }}-llm{{ end }}
                  key: {{ .Values.chat.existingSecretKey | default "LLM_API_KEY" }}
            {{- else }}
            - name: LLM_API_KEY
              value: "EMPTY"
            {{- end }}
            {{- if or .Values.apiToken .Values.existingSecret }}
            - name: ORG_COST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "org-cost-api.fullname" . }}-token{{ end }}
                  key: {{ .Values.existingSecretKey | default "ORG_COST_API_TOKEN" }}
            {{- end }}
            {{- range $k, $v := .Values.chat.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Single uvicorn worker can block on sync LiteLLM; tolerate slow probes.
          livenessProbe:
            httpGet:
              path: /v1/chat/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v1/chat/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.chat.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
